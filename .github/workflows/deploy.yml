name: Deploy automatico

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a publicar (opcional)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Definir versao
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="web-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versao preparada: $VERSION"

      - name: Atualizar arquivos de versao e cache
        shell: pwsh
        run: ./tools/gerar-versao-publicacao.ps1 -Version "$env:APP_VERSION"

      - name: Build
        run: npm run build

      - name: Testes de regras financeiras
        run: node tests/financial-rules.test.mjs

      - name: Verificar arquivos publicados
        shell: bash
        run: |
          test -f dist/version.json
          test -f dist/sw.js
          test -f dist/instalar-celular.html
          grep -q "$APP_VERSION" dist/version.json
          grep -q "$APP_VERSION" dist/sw.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Preparar Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar na Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
