<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Rio dos Passos</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f4f6fa; font-family:system-ui,sans-serif; }
  .login-card { background:#fff; padding:2rem; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.08); width:100%; max-width:360px; }
  .login-card h1 { margin:0 0 .5rem; font-size:1.4rem; color:#1a2a4a; }
  .login-card p.sub { margin:0 0 1.5rem; color:#666; font-size:.9rem; }
  .login-card label { display:block; margin:.75rem 0 .25rem; font-size:.85rem; color:#333; font-weight:600; }
  .login-card input { width:100%; padding:.6rem .75rem; border:1px solid #d0d5dd; border-radius:6px; font-size:1rem; box-sizing:border-box; }
  .login-card button { width:100%; margin-top:1.25rem; padding:.7rem; background:#1a5fb4; color:#fff; border:none; border-radius:6px; font-size:1rem; font-weight:600; cursor:pointer; }
  .password-field { position:relative; display:block; }
  .password-field input { padding-right:5.25rem; }
  .login-card .password-toggle { position:absolute; top:50%; right:.4rem; transform:translateY(-50%); width:auto; margin:0; padding:.35rem .55rem; background:#eef3f2; color:#1a2a4a; border:1px solid #d0d5dd; border-radius:5px; font-size:.78rem; line-height:1; }
  .login-card button:disabled { opacity:.6; cursor:wait; }
  .login-card .err { margin-top:1rem; padding:.6rem; background:#fee; color:#c00; border-radius:6px; font-size:.85rem; display:none; }
  #activation-form { display:none; }
</style>
</head>
<body>
  <form class="login-card" id="login-form">
    <h1>Imobiliária Rio dos Passos</h1>
    <p class="sub">Entre com seu email e senha cadastrados.</p>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Senha</label>
    <span class="password-field"><input type="password" id="password" required autocomplete="current-password"><button class="password-toggle" type="button" data-toggle-password="password" aria-label="Exibir senha" aria-pressed="false">Exibir</button></span>
    <button type="submit" id="submit-btn">Entrar</button>
    <div class="err" id="err"></div>
  </form>

  <form class="login-card" id="activation-form">
    <h1>Ativar seu acesso</h1>
    <p class="sub">Defina uma senha para entrar na Imobiliária Rio dos Passos.</p>
    <label for="new-password">Nova senha</label>
    <span class="password-field"><input type="password" id="new-password" required minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" data-toggle-password="new-password" aria-label="Exibir senha" aria-pressed="false">Exibir</button></span>
    <label for="confirm-password">Confirmar nova senha</label>
    <span class="password-field"><input type="password" id="confirm-password" required minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" data-toggle-password="confirm-password" aria-label="Exibir senha" aria-pressed="false">Exibir</button></span>
    <button type="submit" id="activation-btn">Ativar acesso</button>
    <div class="err" id="activation-err"></div>
  </form>

  <script>
    window.IMOB_AUTH_FLOW = /type=(invite|recovery)/.test(location.hash + location.search);
    if (!window.IMOB_AUTH_FLOW) location.replace("index.html");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=local-1.9.31"></script>
  <script src="supabase-sync.js?v=local-1.9.31"></script>
  <script>
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-toggle-password]");
      if (!button) return;
      const input = document.getElementById(button.dataset.togglePassword);
      if (!input) return;
      const showPassword = input.type === "password";
      input.type = showPassword ? "text" : "password";
      button.textContent = showPassword ? "Ocultar" : "Exibir";
      button.setAttribute("aria-label", showPassword ? "Ocultar senha" : "Exibir senha");
      button.setAttribute("aria-pressed", String(showPassword));
    });
    const offlineUserKey = "gestao-locacoes-last-online-user-v1";
    const sessionKey = "gestao-locacoes-session-v1";
    const sessionUserKey = "gestao-locacoes-session-user-v1";
    const backupKey = "gestao-locacoes-backups-v1";
    const authFlow = Boolean(window.IMOB_AUTH_FLOW);

    function freeLocalStorageSpace() {
      try {
        const storedBackups = JSON.parse(localStorage.getItem(backupKey) || "{}");
        const items = Array.isArray(storedBackups.items) ? storedBackups.items : [];
        if (items.length) {
          const manual = items.filter((item) => item.reason === "manual").slice(0, 1);
          const latest = items.slice(0, 1);
          const reduced = [...manual, ...latest].filter((item, index, list) => item?.id && list.findIndex((other) => other.id === item.id) === index);
          localStorage.setItem(backupKey, JSON.stringify({ items: reduced }));
        }
      } catch {
        localStorage.removeItem(backupKey);
      }
      ["gestao-supabase-cache-v1", "gestao-supabase-pending-v1"].forEach((key) => {
        try {
          localStorage.removeItem(key);
        } catch {
          console.warn("Nao foi possivel liberar cache local:", key);
        }
      });
    }

    function getCachedOfflineUser() {
      try {
        return JSON.parse(localStorage.getItem(offlineUserKey));
      } catch {
        return null;
      }
    }

    function cacheOfflineUser(user) {
      if (!user?.id && !user?.email) return;
      const payload = JSON.stringify({
          id: user.id || user.email,
          email: user.email || "",
          username: user.email || "usuario@offline",
          role: "admin",
          cachedAt: new Date().toISOString(),
        });
      try {
        localStorage.setItem(offlineUserKey, payload);
      } catch {
        freeLocalStorageSpace();
        localStorage.setItem(offlineUserKey, payload);
      }
    }

    function enterOffline(user) {
      sessionStorage.setItem(sessionKey, "active");
      sessionStorage.setItem(sessionUserKey, JSON.stringify({
        id: user.id || user.email || "offline-user",
        username: user.email || user.username || "usuario@offline",
        role: user.role || "admin",
        offline: true,
      }));
      location.replace("index.html");
    }

    function enterOnline(user) {
      sessionStorage.setItem(sessionKey, "active");
      sessionStorage.setItem(sessionUserKey, JSON.stringify({
        id: user.id,
        username: user.email || "usuario@supabase",
        role: user.appAccessProfile?.role || user.app_metadata?.role || user.user_metadata?.role || "admin",
      }));
      location.replace("index.html");
    }

    (async () => {
      const err = document.getElementById("err");
      const btn = document.getElementById("submit-btn");
      if (authFlow) {
        document.getElementById("login-form").style.display = "none";
        document.getElementById("activation-form").style.display = "block";
        try {
          await window.SupabaseSync?.client.auth.getSession();
        } catch (error) {
          const activationErr = document.getElementById("activation-err");
          activationErr.textContent = "Não foi possível validar o convite: " + (error.message || error);
          activationErr.style.display = "block";
        }
        return;
      }
      if (!window.SupabaseSync) {
        const cachedUser = getCachedOfflineUser();
        if (!navigator.onLine && cachedUser) {
          err.textContent = "Modo offline ativo. Entre com o ultimo email validado neste dispositivo.";
          err.style.display = "block";
          btn.disabled = false;
          return;
        }
        err.textContent = "Nao foi possivel carregar a conexao online. Verifique a internet e recarregue.";
        err.style.display = "block";
        btn.disabled = true;
        return;
      }
      try {
        const user = await window.SupabaseSync.getCurrentUser();
        if (user) enterOnline(user);
      } catch {
        err.textContent = "Nao foi possivel verificar uma sessao anterior. Informe email e senha para entrar novamente.";
        err.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    })();

    document.getElementById("activation-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("new-password").value;
      const confirmation = document.getElementById("confirm-password").value;
      const btn = document.getElementById("activation-btn");
      const err = document.getElementById("activation-err");
      err.style.display = "none";
      if (password !== confirmation) {
        err.textContent = "As senhas não coincidem.";
        err.style.display = "block";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Ativando...";
      try {
        const { data } = await window.SupabaseSync.client.auth.getSession();
        if (!data?.session) throw new Error("Este convite expirou ou já foi utilizado. Solicite um novo convite ao administrador.");
        const { error } = await window.SupabaseSync.client.auth.updateUser({ password });
        if (error) throw error;
        const user = await window.SupabaseSync.getCurrentUser();
        if (user) cacheOfflineUser(user);
        history.replaceState({}, "", location.pathname);
        location.replace("index.html");
      } catch (error) {
        err.textContent = "Não foi possível ativar o acesso: " + (error.message || error);
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Ativar acesso";
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const err = document.getElementById("err");
      err.style.display = "none";
      btn.disabled = true; btn.textContent = "Entrando...";
      try {
        freeLocalStorageSpace();
        if (!window.SupabaseSync) {
          const cachedUser = getCachedOfflineUser();
          const email = document.getElementById("email").value.trim();
          if (!navigator.onLine && cachedUser && (!email || email.toLowerCase() === String(cachedUser.email || "").toLowerCase())) {
            enterOffline(cachedUser);
            return;
          }
          throw new Error("Conexao online nao carregada. Verifique a internet e recarregue.");
        }
        const signedUser = await window.SupabaseSync.signIn(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        const user = signedUser || await window.SupabaseSync.getCurrentUser();
        if (!user) throw new Error("Login aceito, mas a sessao nao foi gravada no navegador. Recarregue e tente novamente.");
        cacheOfflineUser(user);
        enterOnline(user);
      } catch (e2) {
        err.textContent = "Falha no login: " + (e2.message || e2);
        err.style.display = "block";
        btn.disabled = false; btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
